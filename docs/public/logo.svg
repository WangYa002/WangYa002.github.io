<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <!-- 冷调背景 -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#F3F8FA"/>
      <stop offset="70%" stop-color="#DCECF1"/>
      <stop offset="100%" stop-color="#9EC8D3"/>
    </radialGradient>

    <!-- 蓝青色字母渐变 -->
    <linearGradient id="letterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#087F98"/>
      <stop offset="50%" stop-color="#166995"/>
      <stop offset="100%" stop-color="#2C8B93"/>
    </linearGradient>

    <!-- 光晕效果 -->
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feFlood flood-color="#087F98" flood-opacity="0.4"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- 内阴影 -->
    <filter id="innerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#102B3A" flood-opacity="0.12"/>
    </filter>

    <!-- 点击涟漪效果 -->
    <filter id="ripple" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .logo-bg { transition: all 0.4s ease; }
      .logo-circle { transition: all 0.4s ease; transform-origin: center; }
      .logo-letter { transition: all 0.3s ease; transform-origin: center; }
      .logo-ring { transition: all 0.5s ease; transform-origin: center; }
      .logo-dot { transition: all 0.3s ease; }
      .ripple-circle { opacity: 0; transform: scale(0); transform-origin: center; }

      /* Hover 效果 */
      .logo-group:hover .logo-bg { filter: brightness(1.05); }
      .logo-group:hover .logo-circle { transform: scale(1.02); }
      .logo-group:hover .logo-letter { transform: scale(1.05); filter: brightness(1.15); }
      .logo-group:hover .logo-ring { opacity: 0.6; transform: scale(1.05) rotate(15deg); }
      .logo-group:hover .logo-dot { transform: scale(1.3); }

      /* 点击涟漪 */
      @keyframes rippleEffect {
        0% { transform: scale(0); opacity: 0.8; }
        100% { transform: scale(2.5); opacity: 0; }
      }
      .ripple-animate { animation: rippleEffect 0.6s ease-out forwards; }

      /* 字母打字机效果（可选） */
      @keyframes letterBounce {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.08); }
      }
      .bounce-animate { animation: letterBounce 0.4s ease-out; }
    </style>
  </defs>

  <g class="logo-group" style="cursor: pointer;">
    <!-- 点击涟漪层（点击时触发） -->
    <circle class="ripple-circle" id="ripple1" cx="100" cy="100" r="90" fill="none" stroke="#087F98" stroke-width="2" opacity="0"/>
    <circle class="ripple-circle" id="ripple2" cx="100" cy="100" r="90" fill="none" stroke="#2C8B93" stroke-width="1.5" opacity="0"/>

    <!-- 背景圆形 -->
    <circle class="logo-bg" cx="100" cy="100" r="90" fill="url(#bgGrad)"/>

    <!-- 外装饰环 -->
    <circle class="logo-ring ring-outer" cx="100" cy="100" r="88" fill="none" stroke="#087F98" stroke-width="0.5" stroke-dasharray="8 4" opacity="0.4"/>

    <!-- 中间装饰环 -->
    <circle class="logo-ring ring-inner" cx="100" cy="100" r="78" fill="none" stroke="#2C8B93" stroke-width="0.8" stroke-dasharray="4 6" opacity="0.35"/>

    <!-- 内圈装饰线 -->
    <circle class="logo-circle" cx="100" cy="100" r="68" fill="none" stroke="#166995" stroke-width="0.5" opacity="0.3"/>

    <!-- 字母 W - 使用路径获得更精细的控制 -->
    <g class="logo-letter" filter="url(#innerShadow)">
      <path d="M60 95 L75 140 L90 105 L100 140 L110 105 L125 140 L140 95"
            fill="none"
            stroke="url(#letterGrad)"
            stroke-width="8"
            stroke-linecap="round"
            stroke-linejoin="round"/>
    </g>

    <!-- 底部装饰线 -->
    <line class="logo-circle" x1="65" y1="150" x2="135" y2="150" stroke="#2C8B93" stroke-width="2" stroke-linecap="round" opacity="0.5"/>

    <!-- 装饰点 -->
    <circle class="logo-dot dot-1" cx="30" cy="30" r="5" fill="#087F98" opacity="0.5"/>
    <circle class="logo-dot dot-2" cx="170" cy="30" r="4" fill="#2C8B93" opacity="0.4"/>
    <circle class="logo-dot dot-3" cx="30" cy="170" r="4" fill="#2C8B93" opacity="0.4"/>
    <circle class="logo-dot dot-4" cx="170" cy="170" r="5" fill="#087F98" opacity="0.5"/>
  </g>

  <script type="text/javascript"><![CDATA[
    (function() {
      var svg = document.querySelector('svg');
      var group = svg.querySelector('.logo-group');
      var letter = svg.querySelector('.logo-letter');
      var ripples = [svg.querySelector('#ripple1'), svg.querySelector('#ripple2')];

      group.addEventListener('click', function(e) {
        // 字母弹跳效果
        letter.classList.remove('bounce-animate');
        void letter.offsetWidth; // 触发重绘
        letter.classList.add('bounce-animate');

        // 涟漪扩散效果
        ripples.forEach(function(ripple, i) {
          ripple.classList.remove('ripple-animate');
          ripple.style.opacity = '0.6';
          ripple.style.stroke = i === 0 ? '#087F98' : '#2C8B93';
          void ripple.offsetWidth;
          ripple.style.animationDelay = (i * 0.15) + 's';
          ripple.classList.add('ripple-animate');
        });

        // 动画结束后清理
        setTimeout(function() {
          ripples.forEach(function(ripple) {
            ripple.classList.remove('ripple-animate');
            ripple.style.opacity = '0';
          });
        }, 800);
      });
    })();
  ]]></script>
</svg>
