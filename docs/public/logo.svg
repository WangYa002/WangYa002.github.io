<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <!-- 主背景渐变 - 温暖的沙色 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E8DCC7"/>
      <stop offset="100%" style="stop-color:#D4B895"/>
    </linearGradient>

    <!-- 字母渐变 - 陶土色 -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C66B3D"/>
      <stop offset="100%" style="stop-color:#B08B6E"/>
    </linearGradient>

    <!-- 内阴影效果 -->
    <filter id="innerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#2D2A26" flood-opacity="0.15"/>
    </filter>

    <!-- 外发光效果 -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 背景圆形 - 柔和的沙色 -->
  <circle cx="100" cy="100" r="90" fill="url(#bgGrad)"/>

  <!-- 装饰圆环 - 陶土色细线 -->
  <circle cx="100" cy="100" r="80" fill="none" stroke="#C66B3D" stroke-width="1.5" opacity="0.3"/>

  <!-- 第二个装饰圆环 -->
  <circle cx="100" cy="100" r="72" fill="none" stroke="#B08B6E" stroke-width="0.5" opacity="0.4"/>

  <!-- 字母 W - 渐变填充 + 微妙的阴影 -->
  <text x="100" y="125"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="75"
        font-weight="bold"
        fill="url(#textGrad)"
        text-anchor="middle"
        filter="url(#innerShadow)">W</text>

  <!-- W 下方的装饰线 -->
  <line x1="60" y1="145" x2="140" y2="145" stroke="#606C38" stroke-width="3" stroke-linecap="round" opacity="0.6"/>

  <!-- 装饰点 - 左上 -->
  <circle cx="35" cy="35" r="6" fill="#C66B3D" opacity="0.5"/>
  <!-- 装饰点 - 右上 -->
  <circle cx="165" cy="35" r="4" fill="#606C38" opacity="0.4"/>
  <!-- 装饰点 - 左下 -->
  <circle cx="35" cy="165" r="4" fill="#606C38" opacity="0.4"/>
  <!-- 装饰点 - 右下 -->
  <circle cx="165" cy="165" r="6" fill="#C66B3D" opacity="0.5"/>
</svg>