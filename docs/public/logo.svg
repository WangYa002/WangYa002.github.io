<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#646cff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#747bff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#bd34fe;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f0f0f0;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- 背景圆形 -->
  <circle cx="100" cy="100" r="90" fill="url(#bgGrad)"/>
  <!-- 装饰圆环 -->
  <circle cx="100" cy="100" r="75" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
  <!-- 字母 W -->
  <text x="100" y="125" font-family="Georgia, serif" font-size="80" font-weight="bold" fill="url(#textGrad)" text-anchor="middle" filter="url(#shadow)">W</text>
  <!-- 装饰点 -->
  <circle cx="50" cy="50" r="6" fill="rgba(255,255,255,0.6)"/>
  <circle cx="150" cy="50" r="4" fill="rgba(255,255,255,0.4)"/>
  <circle cx="50" cy="150" r="4" fill="rgba(255,255,255,0.4)"/>
  <circle cx="150" cy="150" r="6" fill="rgba(255,255,255,0.6)"/>
</svg>